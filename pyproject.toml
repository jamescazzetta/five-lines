[project]
name = "five-lines-jev"
version = "0.1.0"
description = "Review a PR diff against the ten rules of Five Lines of Code: mechanical checks where a rule can be counted, Jev (typesafe.ai) where it needs judgment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
five-lines = "five_lines.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"
