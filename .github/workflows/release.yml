# Push a tag like v0.1.0 to build every platform and publish a GitHub Release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  archive: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,       archive: tar.gz }
          - { os: macos-latest,     target: x86_64-apple-darwin,        archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     archive: zip }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc,    archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: musl toolchain (static Linux binary, runs on any distribution)
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          name=five-lines-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name" && cp target/${{ matrix.target }}/release/five-lines README.md "$name"/
          tar -czf "$name.tar.gz" "$name"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "five-lines-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/five-lines.exe, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: five-lines-*.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum five-lines-* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
